name: Validate Anatomy Atlas
on:
  push:
    branches:
      - "v4-*"
      - "v5-*"
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
